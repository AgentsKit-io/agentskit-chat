name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main and scheduled runs always finish.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/ci-standard.yml
    permissions:
      actions: write
      contents: read

  # Keeps the required check name `quality`: green only when every pipeline stage passed.
  quality:
    needs: pipeline
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Pipeline result
        env:
          RESULT: ${{ needs.pipeline.result }}
          MODE: ${{ needs.pipeline.outputs.mode }}
        run: |
          echo "pipeline: $RESULT (mode: ${MODE:-unknown})"
          test "$RESULT" = success

  browser-e2e:
    needs: pipeline
    if: github.actor != 'dependabot[bot]' && contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (pull requests only read; main seeds)
        id: pnpm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Save pnpm store (main only)
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore Playwright browsers (pull requests only read; main seeds)
        id: playwright-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium (retry on mirror outages)
        run: |
          for attempt in 1 2; do
            timeout 120 sudo apt-get update || true
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install --with-deps failed (attempt $attempt); retrying"
            sleep 15
          done
          # The apt mirror is unreachable: install the browser alone; the runner image ships most system libraries.
          echo "falling back to playwright install without system packages"
          timeout 300 pnpm exec playwright install chromium
      - name: Save Playwright browsers (main only)
        if: github.event_name == 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Upload browser test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  ink-pty:
    needs: pipeline
    if: contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (pull requests only read; main seeds)
        id: pnpm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Save pnpm store (main only)
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The root postinstall runs before node-pty is linked and a store restored without side effects
      # skips its build, so compile pty.node here when it is missing.
      - run: node scripts/ensure-node-pty-helper.mjs --strict
      - run: pnpm build
      - run: pnpm test:pty
      - run: pnpm test:expo

  runtime-contract:
    needs: pipeline
    if: contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    timeout-minutes: 30
    # RF-06: the same metered turn, with sessions, decisions, memory and cost in Postgres, on Node and on workerd.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: chat_test
          POSTGRES_DB: chat_test
        ports:
          - 56439:5432
        options: >-
          --health-cmd "pg_isready -U chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (pull requests only read; main seeds)
        id: pnpm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Save pnpm store (main only)
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @agentskit/chat-protocol build
      - run: pnpm --filter @agentskit/chat build
      - run: pnpm test:storage:pg:types
      - run: pnpm test:runtime:pg
      # RF-07: the previous published schema, then the current drizzle-kit migrations, without data loss.
      - run: pnpm test:migrations:pg
