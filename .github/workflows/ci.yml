name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:conformance
      - name: Verify Changesets against main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then git branch --force main origin/main; fi
          pnpm exec changeset status
      - name: Run tests and package coverage floors
        run: pnpm test
      - run: pnpm build
      - run: pnpm check:public-api
      - run: pnpm conformance:gate
      - run: pnpm bundle:budget
      # Generate ignored artifacts; this proves determinism, not committed-index freshness.
      - name: Build deterministic repository index
        run: |
          pnpm docs:bridge:index
          first_index=$(mktemp)
          trap 'rm -f "$first_index"' EXIT
          cp .doc-bridge/index.json "$first_index"
          pnpm docs:bridge:index
          cmp "$first_index" .doc-bridge/index.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const tracked = new Set(execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0'))
          const index = JSON.parse(readFileSync('.doc-bridge/index.json', 'utf8'))
          const untracked = index.knowledge.filter(entry => !tracked.has(entry.path))
          if (untracked.length) throw new Error(`Index includes untracked inputs: ${untracked.map(entry => entry.path).join(', ')}`)
          NODE
      - run: pnpm docs:bridge:gate
      - run: pnpm docs:bridge:conformance
      - run: pnpm docs:bridge:doctor
      - run: pnpm exec vitest run scripts/doc-bridge-index.test.mjs --maxWorkers=2
      - run: pnpm ecosystem:claims:check
      - run: pnpm ecosystem:adoption:check
      - run: pnpm check:readme-standard
      - run: pnpm test:readme-standard
      - run: node scripts/release-gate.mjs
      - run: node scripts/pack-release.mjs

  browser-e2e:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Upload browser test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  ink-pty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:pty
      - run: pnpm test:expo
