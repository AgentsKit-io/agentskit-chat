packages:
  - "packages/*"
  - "apps/*"

overrides:
  # GHSA-9wx9-5pv9-3349
  seroval: "1.6.11"
  shell-quote: "1.12.0"
  # GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-5jgf-p345-68v8, GHSA-qw65-cvwx-89v3, GHSA-hrr3-gc8f-f4qj
  # GHSA-333x-w4r6-6crp
  fast-uri: "3.1.9"
  next: ">=15.5.28 <16"
  sharp: ">=0.35.0 <1"
  postcss: ">=8.5.23 <9"
  nanoid: "3.3.20"
  image-size: "npm:image-size-next@1.2.2"
  # GHSA-5j98-mcp5-4vw2 (glob CLI command injection, fixed in 10.5.0) and
  # GHSA-3g3m-2fjr-6pw4 (abort bypass in glob 9.0.0-14.0.1, fixed only in 14.0.2)
  "glob@>=9 <14.0.2": "14.0.2"
  # GHSA-q2hr-2g5m-vwhr
  brace-expansion: ">=5.0.12 <6"
  # @opennextjs/cloudflare (devDependency, build-time only) -> glob@9 -> minimatch@8 needs the
  # CJS default export of brace-expansion 2.x; pinned to the latest 2.x release (2.1.7).
  "minimatch@8>brace-expansion": "2.1.7"
  # GHSA-p98j-92pf-mc4p, GHSA-cg2g-xh64-v4q7
  dompurify: "3.4.17"
  # GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32, GHSA-x5rw-q4pp-hg5g,
  # GHSA-4q55-j62x-fr9h, GHSA-9rgm-9g3h-6x36, GHSA-hx4r-w6wj-j8fg
  devalue: "5.9.4"
  # GHSA-67c8-pqhq-4rmx
  piscina: "5.3.2"
  mermaid: "11.17.2"
  uuid: "11.1.1"
  esbuild: ">=0.28.1 <1"
  # GHSA-2883-xcg3-v3hh
  'js-yaml@<4': "3.15.2"
  'js-yaml@>=4 <5': "4.3.2"
  # GHSA-c7q8-3ch8-vqpv, GHSA-93r5-fhx6-vmg9, GHSA-w2rr-34g9-rvrj,
  # GHSA-x4fp-j954-r2f4, GHSA-27p8-2357-5qqv, GHSA-8344-3jmq-59r6,
  # GHSA-965w-775f-mr7g, GHSA-4w3w-2rp5-g8jm, GHSA-3px3-54cx-rmw9,
  # GHSA-g53g-w8rj-fmg7, GHSA-6mj3-qw4j-hgrw, GHSA-vr34-hp96-76pp,
  # GHSA-6h8r-xr42-gp59, GHSA-6gmq-8vp8-gcm6
  '@xmldom/xmldom@<0.9': "0.8.15"
  '@xmldom/xmldom@>=0.9 <1': "0.9.12"
  # RF-09 (#271): production advisories reported by `pnpm audit --prod`.
  # GHSA-7wch-p9px-956x, GHSA-jc66-7q78-782g, GHSA-8hrf-8g6f-7xwp, GHSA-hqq3-7jhf-c5jx,
  # GHSA-5x38-2vff-x55p, GHSA-6wvx-3r32-xmcg, GHSA-525v-9gp9-w22h, GHSA-5cwg-6vw7-rj6p,
  # GHSA-4642-5mcj-2rqw, GHSA-h6cr-wjv9-3cpp, GHSA-4487-j8r4-4g2f
  node-forge: ">=1.4.3 <2"
  # GHSA-238p-pmpm-9mq7
  katex: ">=0.18.2 <1"
  # GHSA-mrhx-c7xc-m3w5 (fumadocs-mdx 11 and @expo/cli still ask for zod 3)
  'fumadocs-mdx>zod': "4.6.7"
  '@expo/cli>zod': "4.6.7"
  # GHSA-g3hv-75wg-m249
  'minimatch@>=7 <11.0.1': "11.0.5"
  # GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472, GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26,
  # GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm, GHSA-9fm3-97px-rjf6, GHSA-55wc-3pg8-jfw6
  'undici@>=7 <7.30.1': "7.30.2"
  # GHSA-6pq8-jhm2-2vcw
  qs: ">=6.16.1 <7"
  '@angular/common': ">=21.2.25 <22"
  '@angular/core': ">=21.2.25 <22"
  '@angular/compiler': ">=21.2.25 <22"
  browserslist: ">=4.28.7 <5"
  # ponytail: pin the doc tooling subtree to the workspace React/Ink/zod; duplicates break Ink tests, fixtures, and the docs bundle budget.
  '@agentskit/harness>react': "19.3.1"
  '@agentskit/harness>ink': "7.1.1"
  '@agentskit/doc-bridge>react': "19.3.1"
  '@agentskit/doc-bridge>zod': "4.6.7"
  '@agentskit/harness>zod': "4.6.7"

patchedDependencies:
  image-size-next@1.2.2: patches/image-size-next@1.2.2.patch

onlyBuiltDependencies:
  - node-pty

# node-pty ships prebuilds only for macOS/Windows; on Linux its install script falls back to
# `node-gyp rebuild`, which pnpm does not put on PATH unless node-pty depends on it.
packageExtensions:
  node-pty@1.1.0:
    dependencies:
      node-gyp: "^12.0.0"
